name: Mantener activo Supabase

# El plan gratuito de Supabase pausa el proyecto tras una semana sin actividad y,
# con él pausado, el formulario de auditoría falla. La función solicitar-auditoria
# responde a GET con una consulta mínima a la base (no guarda ni devuelve datos).

on:
  schedule:
    - cron: "17 7 * * 1,4" # lunes y jueves, 07:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la función
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors \
            "https://gotsjhofrcdnyxdwowel.supabase.co/functions/v1/solicitar-auditoria"
